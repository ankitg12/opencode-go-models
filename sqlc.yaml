version: "2"
sql:
  - engine: "sqlite"
    schema: "sql/schema.sql"
    queries: "sql/query.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "REAL"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          - db_type: "INTEGER"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
